<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calibration - CaseGrid</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="onboard" data-screen="onboarding" data-prefix="">
  <header class="onboard__top">
    <span class="sidebar__mark" style="background:var(--accent)" id="brand-mark"></span>
    <span style="font-size:15px;font-weight:640;letter-spacing:-.01em">CaseGrid</span>
    <span class="badge" style="margin-left:8px">Calibration</span>
    <div class="spacer"></div>
    <span class="t-xs subtle">Great Lakes Institute of Management, Chennai</span>
    <a class="btn btn--ghost btn--sm" href="../index.html">Exit</a>
  </header>

  <main class="onboard__body">
    <div class="onboard__panel">

      <div class="steps" id="steps" aria-label="Calibration progress"></div>

      <div class="card fade-in" id="step-card">
        <div class="card__body" id="step-body" style="padding:28px 32px"></div>
        <div class="card__foot" style="padding:16px 32px">
          <button class="btn" id="back-btn" type="button">Back</button>
          <span class="t-xs subtle" id="step-note"></span>
          <div class="spacer"></div>
          <button class="btn btn--primary" id="next-btn" type="button">Continue</button>
        </div>
      </div>

      <p class="t-xs subtle" style="margin-top:16px;text-align:center">
        Calibration takes about two minutes. You can change your track and practice window later from Settings.
      </p>
    </div>
  </main>
</div>

<script src="../data.js"></script>
<script src="../app.js"></script>
<script>
(function () {
  'use strict';
  var icon = CaseGrid.icon, D = CaseGrid.data;
  document.getElementById('brand-mark').innerHTML = icon('layers', 15);

  var STEPS = ['Your email', 'Target track', 'Case experience', 'Practice window'];

  /* The landing page hands the address over in the query string. */
  function seededEmail() {
    var m = /[?&]email=([^&]+)/.exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }

  var state = {
    step: 0,
    email: seededEmail(),
    emailTouched: false,
    track: 'Consulting',
    caseCount: 22,
    windowStart: '22:30',
    windowEnd: '01:30',
    days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
    submitting: false,
    done: false
  };

  var TRACKS = [
    { id: 'Consulting', desc: 'Profitability, market entry, M&A. Heaviest rotation on CaseGrid - 61% of the batch.' },
    { id: 'Product', desc: 'Product sense, metrics, prioritisation. Guesstimates appear more often here.' },
    { id: 'Finance', desc: 'Valuation-flavoured cases, deal screens, working-capital diagnostics.' },
    { id: 'General Management', desc: 'Operations and organisation cases with a lighter numerical load.' }
  ];

  var TIMES = ['20:00', '20:30', '21:00', '21:30', '22:00', '22:30', '23:00', '23:30', '00:00', '00:30', '01:00', '01:30', '02:00'];

  function pretty(t) {
    var h = parseInt(t.slice(0, 2), 10), m = t.slice(3);
    var ap = h >= 12 ? 'PM' : 'AM';
    var hh = h % 12; if (hh === 0) { hh = 12; }
    return hh + ':' + m + ' ' + ap;
  }

  function emailValid() {
    /* Any working address is accepted - no domain restriction. */
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(state.email.trim());
  }

  function canAdvance() {
    if (state.step === 0) { return emailValid(); }
    if (state.step === 3) { return state.days.length > 0; }
    return true;
  }

  function renderSteps() {
    var out = '';
    for (var i = 0; i < STEPS.length; i++) {
      var cls = i < state.step ? 'step step--done' : (i === state.step ? 'step step--active' : 'step');
      out += '<div class="' + cls + '"><span class="step__dot">' +
        (i < state.step ? icon('checkSm', 13) : (i + 1)) + '</span>' +
        '<span class="step__label">' + STEPS[i] + '</span></div>';
      if (i < STEPS.length - 1) {
        out += '<span class="step__line' + (i < state.step ? ' step__line--done' : '') + '"></span>';
      }
    }
    document.getElementById('steps').innerHTML = out;
  }

  function stepEmail() {
    var invalid = state.emailTouched && !emailValid();
    return '<h1 class="t-h1">Verify your email</h1>' +
      '<p class="t-body muted" style="margin-top:6px;max-width:52ch">We send a six-digit code to confirm the address is yours. Any provider works - use whichever inbox you actually read at midnight.</p>' +
      '<div class="field" style="margin-top:24px">' +
      '<label class="field__label" for="email">Email address</label>' +
      '<div class="input-affix">' + icon('mail', 16) +
      '<input class="input' + (invalid ? ' input--invalid' : '') + '" id="email" type="email" ' +
      'value="' + CaseGrid.esc(state.email) + '" placeholder="you@yourcampus.edu" ' +
      'autocomplete="email" aria-describedby="email-hint"></div>' +
      (invalid
        ? '<span class="t-xs" style="color:var(--danger);display:flex;gap:6px;align-items:center">' + icon('alert', 13) + 'That does not look like an email address yet.</span>'
        : '<span class="field__hint" id="email-hint">A six-digit code goes to this inbox. It expires in 10 minutes.</span>') +
      '</div>' +
      '<div class="callout" style="margin-top:20px">' + icon('building', 16) +
      '<div><strong>Great Lakes Institute of Management, Chennai</strong>' +
      '<span class="muted">You are joining the PGPM 2026-27 batch, where 214 students already practise. ' +
      'Batch is how the library counts completions - it does not limit who you can be matched with.</span></div>' +
      '<button class="btn btn--ghost btn--sm" type="button" style="align-self:center;margin-left:auto;flex:none">Change</button></div>';
  }

  function stepTrack() {
    var out = '<h1 class="t-h1">Which track are you preparing for?</h1>' +
      '<p class="t-body muted" style="margin-top:6px;max-width:52ch">This decides who you are matched with and which cases surface first. You can switch tracks once every 30 days.</p>' +
      '<div class="choice-grid" style="margin-top:24px">';
    for (var i = 0; i < TRACKS.length; i++) {
      var t = TRACKS[i], on = state.track === t.id;
      out += '<button class="choice" type="button" role="radio" aria-checked="' + on + '" data-track="' + t.id + '">' +
        '<span class="choice__radio"></span><span><span class="choice__title">' + t.id + '</span>' +
        '<span class="choice__desc">' + t.desc + '</span></span></button>';
    }
    return out + '</div>';
  }

  function stepExperience() {
    var tier = CaseGrid.tierFor(state.caseCount);
    var out = '<h1 class="t-h1">How many full cases have you done?</h1>' +
      '<p class="t-body muted" style="margin-top:6px;max-width:52ch">Count only 30-minute-plus cases with a real partner. Your answer sets your starting tier, and tier governs who you can match with.</p>' +
      '<div class="field" style="margin-top:24px;max-width:220px">' +
      '<label class="field__label" for="count">Cases completed</label>' +
      '<input class="input tnum" id="count" type="number" min="0" max="200" value="' + state.caseCount + '"></div>' +
      '<div class="grid grid--3" style="margin-top:20px;gap:12px">';
    for (var i = 0; i < D.tiers.length; i++) {
      var t = D.tiers[i], on = t.name === tier;
      out += '<div class="card" style="padding:14px 16px;' + (on ? 'border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)' : '') + '">' +
        '<div class="row" style="gap:6px">' +
        '<span style="font-size:13px;font-weight:640;' + (on ? 'color:var(--accent-text)' : '') + '">' + t.name + '</span>' +
        (on ? '<span class="badge badge--accent" style="margin-left:auto">Your tier</span>' : '') + '</div>' +
        '<div class="t-xs ' + (on ? '' : 'subtle') + '" style="margin-top:2px">' + t.range + '</div></div>';
    }
    out += '</div>';

    if (tier === 'Novice') {
      out += '<div class="callout callout--lock" style="margin-top:20px">' + icon('lock', 16) +
        '<div><strong>Novice parity applies for your first 8 cases</strong>' +
        '<span class="muted">You will be matched only with other Novices until you have completed 8 cases. ' +
        'This is not a restriction on your account - it keeps early feedback calibrated, because a Novice being graded by an Advanced peer gets scores they cannot act on. ' +
        'Cases ' + state.caseCount + ' of 8 counted so far.</span>' +
        '<div class="bar" style="margin-top:10px;max-width:280px"><div class="bar__fill" style="width:' + Math.min(100, (state.caseCount / 8) * 100) + '%"></div></div></div></div>';
    } else {
      out += '<div class="callout callout--ok" style="margin-top:20px">' + icon('check', 16) +
        '<div><strong>Cross-tier matching unlocked</strong>' +
        '<span class="muted">At ' + tier + ' you can be matched with Intermediate and Advanced peers, and you may interview Novices. Tier parity only binds a Novice’s first 8 cases.</span></div></div>';
    }
    return out;
  }

  function stepWindow() {
    var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var out = '<h1 class="t-h1">When do you practise?</h1>' +
      '<p class="t-body muted" style="margin-top:6px;max-width:52ch">Matching only ever proposes sessions inside this window, so pick hours you will actually show up for. Cancelling inside 60 minutes costs two credits and dents your reliability score.</p>' +
      '<div class="row" style="margin-top:24px;gap:16px;align-items:flex-end">' +
      '<div class="field" style="width:180px"><label class="field__label" for="w-start">Window opens</label>' +
      '<select class="select" id="w-start">' + opts(state.windowStart) + '</select></div>' +
      '<span class="subtle" style="padding-bottom:9px">to</span>' +
      '<div class="field" style="width:180px"><label class="field__label" for="w-end">Window closes</label>' +
      '<select class="select" id="w-end">' + opts(state.windowEnd) + '</select></div>' +
      '<div class="badge badge--accent" style="height:36px;padding:0 12px">' + icon('clock', 14) +
      pretty(state.windowStart) + ' - ' + pretty(state.windowEnd) + '</div></div>';

    out += '<div class="field" style="margin-top:24px"><span class="field__label">Days you are available</span><div class="chips">';
    for (var i = 0; i < DAYS.length; i++) {
      var on = state.days.indexOf(DAYS[i]) > -1;
      out += '<button class="chip" type="button" aria-pressed="' + on + '" data-day="' + DAYS[i] + '">' +
        (on ? icon('checkSm', 13) : '') + DAYS[i] + '</button>';
    }
    out += '</div>' + (state.days.length === 0
      ? '<span class="t-xs" style="color:var(--danger)">Pick at least one day.</span>'
      : '<span class="field__hint">' + state.days.length + ' days selected. 11 Advanced Consulting peers overlap with this window.</span>') + '</div>';

    out += '<div class="callout" style="margin-top:20px">' + icon('snowflake', 16) +
      '<div><strong>Syndicate Freeze Pass</strong><span class="muted">Life happens. Every student gets one penalty-free reschedule every 14 days, as long as you give 90 minutes notice.</span></div></div>';
    return out;

    function opts(sel) {
      var s = '';
      for (var j = 0; j < TIMES.length; j++) {
        s += '<option value="' + TIMES[j] + '"' + (TIMES[j] === sel ? ' selected' : '') + '>' + pretty(TIMES[j]) + '</option>';
      }
      return s;
    }
  }

  function stepDone() {
    return '<div style="text-align:center;padding:16px 0 8px">' +
      '<div style="width:52px;height:52px;border-radius:999px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px">' + icon('check', 26) + '</div>' +
      '<h1 class="t-h1">You are calibrated, Karthik</h1>' +
      '<p class="t-body muted" style="margin:8px auto 0;max-width:46ch">Three starter credits are on your account. Your first match window opens tonight at ' + pretty(state.windowStart) + '.</p>' +
      '<div class="grid grid--3" style="margin-top:24px;gap:12px;text-align:left">' +
      tile('Track', state.track) + tile('Tier', CaseGrid.tierFor(state.caseCount) + ' · ' + state.caseCount + ' cases') +
      tile('Window', pretty(state.windowStart) + ' - ' + pretty(state.windowEnd)) + '</div>' +
      '<a class="btn btn--primary btn--lg" href="02-dashboard.html" style="margin-top:24px">Go to dashboard</a></div>';

    function tile(k, v) {
      return '<div class="card" style="padding:12px 14px"><div class="t-label">' + k + '</div>' +
        '<div style="font-size:13px;font-weight:600;margin-top:4px">' + v + '</div></div>';
    }
  }

  function render() {
    renderSteps();
    var body = document.getElementById('step-body');
    var foot = document.getElementById('step-card').querySelector('.card__foot');

    if (state.done) {
      body.innerHTML = stepDone();
      foot.classList.add('hidden');
      document.getElementById('steps').classList.add('hidden');
      return;
    }

    body.innerHTML = [stepEmail, stepTrack, stepExperience, stepWindow][state.step]();

    var back = document.getElementById('back-btn');
    var next = document.getElementById('next-btn');
    back.disabled = state.step === 0;
    next.disabled = !canAdvance() || state.submitting;
    next.innerHTML = state.submitting
      ? '<span class="spinner spinner--invert"></span>Creating your profile'
      : (state.step === 3 ? 'Finish calibration' : 'Continue');
    document.getElementById('step-note').textContent = 'Step ' + (state.step + 1) + ' of 4';

    bind();
  }

  function bind() {
    var email = document.getElementById('email');
    if (email) {
      email.addEventListener('input', function () {
        state.email = this.value;
        document.getElementById('next-btn').disabled = !canAdvance();
      });
      email.addEventListener('blur', function () {
        state.emailTouched = true;
        if (!emailValid()) { render(); }
      });
      email.focus();
    }

    var tracks = document.querySelectorAll('[data-track]');
    for (var i = 0; i < tracks.length; i++) {
      tracks[i].addEventListener('click', function () {
        state.track = this.getAttribute('data-track');
        render();
      });
    }

    var count = document.getElementById('count');
    if (count) {
      count.addEventListener('input', function () {
        var v = parseInt(this.value, 10);
        state.caseCount = isNaN(v) ? 0 : Math.max(0, Math.min(200, v));
        var pos = this.selectionStart;
        render();
        var c2 = document.getElementById('count');
        c2.focus();
        try { c2.setSelectionRange(pos, pos); } catch (e) { /* number inputs vary */ }
      });
    }

    var ws = document.getElementById('w-start'), we = document.getElementById('w-end');
    if (ws) { ws.addEventListener('change', function () { state.windowStart = this.value; render(); }); }
    if (we) { we.addEventListener('change', function () { state.windowEnd = this.value; render(); }); }

    var days = document.querySelectorAll('[data-day]');
    for (var j = 0; j < days.length; j++) {
      days[j].addEventListener('click', function () {
        var d = this.getAttribute('data-day');
        var k = state.days.indexOf(d);
        if (k > -1) { state.days.splice(k, 1); } else { state.days.push(d); }
        render();
      });
    }
  }

  document.getElementById('back-btn').addEventListener('click', function () {
    if (state.step > 0) { state.step--; render(); }
  });

  document.getElementById('next-btn').addEventListener('click', function () {
    if (!canAdvance()) { return; }
    if (state.step < 3) { state.step++; render(); return; }
    state.submitting = true;
    render();
    FakeAPI.defer(function () {
      state.submitting = false;
      state.done = true;
      render();
    }, 900);
  });

  render();
})();
</script>
</body>
</html>
